name: LOC Guard

on:
  pull_request:

jobs:
  loc-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run LOC Guard
        run: |
          python3 .agent-tools/loc_guard.py . --config .agent-tools/loc-guard.config.json --base-ref "${{ github.event.pull_request.base.sha }}" --ci
